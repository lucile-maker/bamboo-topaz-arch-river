<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Source+Sans+3:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #F2EEE6;
    }
    .card {
      width: 1200px;
      height: 630px;
      background: #F2EEE6;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grain {
      position: absolute;
      inset: 0;
      opacity: 0.07;
      pointer-events: none;
      mix-blend-mode: multiply;
    }
    .frame {
      position: absolute;
      inset: 40px;
      border: 1.25px solid #24332C;
    }
    .frame-inner {
      position: absolute;
      inset: 48px;
      border: 1px solid rgba(36, 51, 44, 0.28);
    }
    .lockup {
      position: relative;
      z-index: 2;
      text-align: center;
      width: 760px;
    }
    .mark {
      width: 34px;
      height: 34px;
      display: block;
      margin: 0 auto 26px;
    }
    .title {
      font-family: Fraunces, "Liberation Serif", serif;
      font-optical-sizing: auto;
      font-weight: 500;
      font-size: 168px;
      line-height: 0.86;
      color: #1B1916;
      letter-spacing: -0.01em;
    }
    .rule {
      width: 48px;
      height: 1px;
      background: #24332C;
      margin: 30px auto 22px;
    }
    .tag {
      font-family: Fraunces, "Liberation Serif", serif;
      font-style: italic;
      font-optical-sizing: auto;
      font-weight: 400;
      font-size: 28px;
      line-height: 1;
      color: #24332C;
      letter-spacing: 0.01em;
    }
    .place {
      margin-top: 18px;
      font-family: "Source Sans 3", "Liberation Sans", sans-serif;
      font-weight: 400;
      font-size: 12px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #24332C;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="grain" xmlns="http://www.w3.org/2000/svg" width="1200" height="630" aria-hidden="true">
      <filter id="n">
        <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch" />
      </filter>
      <rect width="100%" height="100%" filter="url(#n)" />
    </svg>
    <div class="frame"></div>
    <div class="frame-inner"></div>
    <div class="lockup">
      <svg class="mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#24332C" d="M16 4.8 28.2 15.2H25.4V26.4H6.6V15.2H3.8Z"/>
        <rect x="14.1" y="18.6" width="3.8" height="7.8" fill="#F2EEE6"/>
      </svg>
      <div class="title">George</div>
      <div class="rule"></div>
      <div class="tag">Your home, looked after.</div>
      <div class="place">Toronto membership</div>
    </div>
  </div>
</body>
</html>
